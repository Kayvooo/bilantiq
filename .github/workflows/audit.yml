name: audit

# Woechentlicher Abhaengigkeits-Check. Neue Schwachstellen oder Scan-Fehler lassen den Lauf fehlschlagen.
# Fuer Merge-Sperren die Audit-Jobs zusaetzlich in den Repository-Regeln als erforderlich setzen.
permissions:
  contents: read

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: >-
          pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: python -m scripts.check_dependency_locks && pip check
      - name: pip-audit (blockierend)
        shell: bash
        run: pip-audit --require-hashes -r requirements-dev.lock | tee -a "$GITHUB_STEP_SUMMARY"

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projekt: [frontend]
    defaults:
      run:
        working-directory: ${{ matrix.projekt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: npm audit (blockierend)
        shell: bash
        run: npm audit --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"
