# Produktions-Stack fuer eine selbst betriebene Bilantiq-Instanz. Secrets liegen als root-only Dateien ausserhalb
# des Repositories und werden als Docker-Secrets read-only nach /run/secrets gemountet.
#
# EIGENER SPEICHER: Es gibt keinen zentralen Speicher des Projekts. Zwei Docker-Volumes halten ALLE Daten Ihrer Instanz:
#   postgres_data  die Datenbank
#   backend_data   Belege, Logos, Briefpapier, Kontoauszuege, Altrechnungs-Archiv (STORAGE_DIR=/app/data)
# "docker compose down -v" loescht beide Volumes unwiderruflich. Backups: scripts/backup.sh, siehe docs/self-hosting.md.
name: bilantiq

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    volumes:
      # Alternative: einen Host-Ordner einhaengen, z. B. /srv/bilantiq/daten:/app/data. Der Ordner muss dem Benutzer mit
      # UID 1000 gehoeren (chown 1000:1000), sonst bricht die Startpruefung mit einer Meldung ab.
      - backend_data:/app/data
    secrets:
      - database_url
      - jwt_secret
      - field_encryption_key
      - email_lookup_secret
      - data_encryption_keys
      - blind_index_secret
      - smtp_password
    networks:
      - web
      - backend_internal

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Domains fuer die Caddyfile (TLS-Zertifikate, CSP). Kommen aus .env.prod.
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN in .env.prod setzen}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN in .env.prod setzen}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:

networks:
  web:
  backend_internal:
    internal: true

secrets:
  postgres_password:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/database_url
  jwt_secret:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/jwt_secret
  field_encryption_key:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/field_encryption_key
  email_lookup_secret:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/email_lookup_secret
  data_encryption_keys:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/data_encryption_keys
  blind_index_secret:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/blind_index_secret
  smtp_password:
    file: ${BILANTIQ_SECRETS_DIR:-./secrets}/smtp_password
